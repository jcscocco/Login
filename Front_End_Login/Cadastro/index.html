<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Auth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="toggle" id="toggle">
    <button id="btnLogin" class="active" onclick="mostrarLogin()">Sign In</button>
    <button id="btnCadastro" onclick="mostrarCadastro()">Sign Up</button>
  </div>

  <div id="loginForm" class="form active">
    <h2>Bem-vindo</h2>
    <p class="subtitulo">Entre na sua conta</p>

    <div class="campo">
      <label>Email</label>
      <input type="email" id="emailLogin" placeholder="seu@email.com">
    </div>

    <div class="campo">
      <label>Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senhaLogin" placeholder="••••••••">
        <button type="button" class="toggle-senha" onclick="toggleSenha('senhaLogin', this)">
          <svg id="iconeLogin" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="submit" onclick="login()">Entrar</button>
  </div>

  <div id="cadastroForm" class="form">
    <h2>Criar Conta</h2>
    <p class="subtitulo">Preencha os dados abaixo</p>

    <div class="campo">
      <label>Email</label>
      <input type="email" id="emailCadastro" placeholder="seu@email.com">
    </div>

    <div class="campo">
      <label>Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senhaCadastro" placeholder="••••••••">
        <button type="button" class="toggle-senha" onclick="toggleSenha('senhaCadastro', this)">
          <svg id="iconeCadastro" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="submit" onclick="cadastro()">Cadastrar</button>
  </div>

</div>

<script type="module" src="./script.js"></script>
</body>
</html>
